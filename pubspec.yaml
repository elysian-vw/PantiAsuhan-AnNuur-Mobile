name: annuur_mobile
description: "Aplikasi Mobile Donatur Tetap - Panti Asuhan NU An-Nuur 2 Kota Kediri"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Persistent token storage (secure)
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.6.2

  # WebView untuk Midtrans checkout
  webview_flutter: ^4.10.0

  # UI Utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # URL Launcher
  url_launcher: ^6.3.1

  # Local storage (non-sensitive)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
